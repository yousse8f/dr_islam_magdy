workflows:
  ios-app-store-release:
    name: iOS App Store & TestFlight Release
    integrations:
      app_store_connect: DrIslamApple
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.neutirition.drEslam
      groups:
        - app_store_credentials # Contains: APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
        - firebase_ios_credentials # Optional: GOOGLE_SERVICES_IOS (Base64 string of GoogleService-Info.plist)
      vars:
        BUNDLE_ID: "com.neutirition.drEslam"
        APP_ID: "6741872998"
        BUILD_NAME: "1.1.3"
        BUILD_NUMBER: "13"
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Display Xcode and iOS SDK versions
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Recreate GoogleService-Info.plist if environment variable exists
        script: |
          if [ -n "$GOOGLE_SERVICES_IOS" ]; then
            echo "$GOOGLE_SERVICES_IOS" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist recreated successfully."
          else
            echo "Notice: GOOGLE_SERVICES_IOS variable not set. Skipping plist creation."
          fi
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run static code analysis
        script: |
          flutter analyze
      - name: Run unit and widget tests
        script: |
          flutter test
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Build IPA for App Store & TestFlight
        script: |
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "build/ios/archive/Runner.xcarchive"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - dev@example.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
