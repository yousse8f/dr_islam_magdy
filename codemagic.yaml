workflows:
  ios-app-store-release:
    name: iOS App Store & TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.neutirition.drEslam
      groups:
        - app_store_credentials # Environment group containing APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.neutirition.drEslam"
        APP_ID: "6741872998"
        BUILD_NAME: "1.1.3"
        BUILD_NUMBER: "13"
      flutter: 3.29.0
      xcode: 16.0
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run static code analysis
        script: |
          flutter analyze
      - name: Run unit and widget tests
        script: |
          flutter test
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Build IPA for App Store & TestFlight
        script: |
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "build/ios/archive/Runner.xcarchive"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - dev@example.com
        notify:
          on_success: true
          on_failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
